# lab-os self-caller — invokes the reusable CI workflows against
# lab-os itself on every pull request.
#
# This file also serves as the copy-paste template for phase-2 callers in
# other lab repos (see the "Downstream repo example" comment block below).
#
# Reusable workflows handle all checkouts (caller repo + lab-os script
# source) internally; this caller does NOT need any explicit checkout steps.

name: standards

on:
  pull_request:

permissions:
  contents: read

jobs:
  log-lint:
    uses: ./.github/workflows/log-lint.yml
    # No `with:` needed — defaults (project_log.md / project_log_archive.md)
    # are correct for lab-os.

  docs-budget:
    uses: ./.github/workflows/docs-budget.yml
    with:
      # enforce: true — flipped 2026-06-10 after this repo's first green run,
      # per the §7.2 warn-only-until-first-green posture.
      enforce: true

  merge-bar-check:
    uses: ./.github/workflows/merge-bar-check.yml
    # No `with:` needed — default exclude-globs ("*.md,docs/**,.github/**")
    # are correct for lab-os.

  backlog-lint:
    # lab-os-only: BACKLOG.md is the lab-wide backlog (downstream repos use their
    # own issues). Warn-only until backlog-lint's first green run; Phase 2 flips this.
    # The workflow's self-test step is unconditional either way.
    uses: ./.github/workflows/backlog-lint.yml
    with:
      enforce: false

  backlog-views:
    # lab-os-only. enforce: true — flipped 2026-08-06 with the dashboard
    # regenerated and `--check` green at the same head (PR #68 review,
    # Blocker 1: warn-only let the check's first artifact land drifted, the
    # exact class the tool exists to close). A stale docs/backlog-views.md
    # now FAILS the PR; the remedy is `python3 scripts/backlog_view.py
    # --write`. Script/parse/integrity failures always fail, and the
    # workflow's self-test steps are unconditional either way.
    uses: ./.github/workflows/backlog-views.yml
    with:
      enforce: true

