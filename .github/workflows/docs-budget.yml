# Reusable docs-budget adherence action (spec §9).
#
# Checks the caller repo's always-loaded AI doc surfaces — CLAUDE.md /
# .claude/CLAUDE.md, each .claude/rules/*.md, project_log.md, and the
# always-loaded aggregate (CLAUDE.md + rules, excluding project_log.md) —
# against the context budgets in .claude/rules/04-docs.md (section Tiers &
# budgets). That section owns every byte figure; this file restates none of
# them, so they cannot drift out of sync here.
# Warn above 1.0x, fail above 1.5x — but only when `enforce: true`.
# Default is warn-only until a repo first passes green, per that same
# section: the budget check never fails the job on a budget
# finding, it only emits ::warning annotations. An unrecognized `enforce`
# input fails the job in either mode — that is a config defect, not a budget
# finding. The self-test step below is NOT gated either: a self-test failure
# is a code defect and always fails the job.
#
# Caller example (any lab repo):
#
#   jobs:
#     docs-budget:
#       uses: CAMELS-Research-Group/lab-os/.github/workflows/docs-budget.yml@main
#       with:
#         enforce: false   # flip to true after this repo's first green run

name: docs-budget

on:
  workflow_call:
    inputs:
      enforce:
        description: >-
          Fail the job when any surface exceeds 1.5x its budget.
          Leave false (warn-only) until the repo first passes green.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  docs-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v4

      - name: Check out lab-os (script source)
        uses: actions/checkout@v4
        with:
          repository: CAMELS-Research-Group/lab-os
          path: .lab-os

      - name: Self-test docs-budget (unconditional — never gated on enforce)
        run: |
          # A self-test failure is a code defect, not a content warning: it
          # always fails the job, regardless of the enforce input. Without
          # this step the aggregate-cap checks never execute in CI: lab-os'
          # own content run is comfortably inside budget and exercises few of
          # the annotation paths. Every caller checks out lab-os' default
          # branch, so a self-test regression landing on main reds this job in
          # every caller at once, warn-only posture included. That is
          # deliberate — backlog-lint.yml sets the same precedent.
          SCRIPT=".lab-os/scripts/docs_budget.py"
          if [ "$GITHUB_REPOSITORY" = "CAMELS-Research-Group/lab-os" ]; then
            SCRIPT="scripts/docs_budget.py"
          fi
          python3 "$SCRIPT" --self-test

      - name: Run docs-budget
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          # Fail closed on an unrecognized enforce value: anything that is not
          # literally "true"/"false" (an empty caller expression, "True",
          # "yes") must not silently degrade the job to warn-only. Same
          # handling as backlog-lint.yml.
          ARGS=""
          if [ "$ENFORCE" = "true" ]; then
            ARGS="--enforce"
          elif [ "$ENFORCE" != "false" ]; then
            echo "::error::docs-budget: unrecognized enforce input '$ENFORCE' (expected true or false)"
            exit 1
          fi
          # lab-os' own PRs must run the PR's script (main's copy is absent/stale there); gate on repo name, not file-exists, so downstream repos can't shadow the canonical script
          SCRIPT=".lab-os/scripts/docs_budget.py"
          if [ "$GITHUB_REPOSITORY" = "CAMELS-Research-Group/lab-os" ]; then SCRIPT="scripts/docs_budget.py"; fi
          python3 "$SCRIPT" --root . $ARGS
