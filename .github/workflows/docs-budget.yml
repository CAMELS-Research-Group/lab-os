# Reusable docs-budget adherence action.
#
# Checks the caller repo's always-loaded AI doc surfaces against the budgets
# owned by .claude/rules/04-docs.md §Tiers & budgets: CLAUDE.md /
# .claude/CLAUDE.md 12,288 B; each .claude/rules/*.md 8,192 B;
# project_log.md 15,360 B; and the always-loaded AGGREGATE — CLAUDE.md plus
# every rules file, excluding project_log.md — 49,152 B.
#
# The aggregate is the one this job exists for. Per-file budgets cap any one
# surface; the aggregate caps what the always-loaded tier costs every session
# and every subagent, and a tier can sit entirely inside its per-file budgets
# while being thousands of bytes over as a whole. Caravan is in exactly that
# state now: over its 48 KB aggregate with every file inside its own budget.
# Restoring the job there (Caravan#300) surfaced the per-file drift but could
# not see the aggregate at all — Caravan#298 and #302 record both halves.
#
# Warn above 1.0x, fail above 1.5x — but only when `enforce: true`.
# Default is warn-only (the warn-only-until-first-green posture):
# the job never fails, it only emits ::warning annotations.
#
# NOTE for callers pinning @main: the budgets above changed on 2026-08-31 to
# track 04-docs.md (rules 5,120 -> 8,192 B; CLAUDE.md 8,192 -> 12,288 B) and
# the aggregate check was added. A repo already green stays green; a repo that
# was failing on the old, stricter per-file numbers may now pass.
#
# Caller example (any lab repo):
#
#   jobs:
#     docs-budget:
#       uses: CAMELS-Research-Group/lab-os/.github/workflows/docs-budget.yml@main
#       with:
#         enforce: false   # flip to true after this repo's first green run

name: docs-budget

on:
  workflow_call:
    inputs:
      enforce:
        description: >-
          Fail the job when any surface exceeds 1.5x its budget.
          Leave false (warn-only) until the repo first passes green.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  docs-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v4

      - name: Check out lab-os (script source)
        uses: actions/checkout@v4
        with:
          repository: CAMELS-Research-Group/lab-os
          path: .lab-os

      - name: Run docs-budget
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          ARGS=""
          if [ "$ENFORCE" = "true" ]; then ARGS="--enforce"; fi
          # lab-os' own PRs must run the PR's script (main's copy is absent/stale there); gate on repo name, not file-exists, so downstream repos can't shadow the canonical script
          SCRIPT=".lab-os/scripts/docs_budget.py"
          if [ "$GITHUB_REPOSITORY" = "CAMELS-Research-Group/lab-os" ]; then SCRIPT="scripts/docs_budget.py"; fi
          python3 "$SCRIPT" --root . $ARGS
